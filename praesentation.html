<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Spieleabend, Präsentation</title>
<link rel="stylesheet" href="brand.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding: 40px; }
  .wrap { width: 100%; max-width: 1100px; }
  .eyebrow-big { font-size: clamp(18px, 2.2vw, 26px); font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; }
  .title-big { font-size: clamp(46px, 8vw, 110px); font-weight: 900; text-transform: uppercase; line-height: 1.02; margin: 0; }
  .rule-big { font-size: clamp(20px, 2.6vw, 34px); color: var(--ink-soft); margin-top: 26px; font-weight: 600; max-width: 900px; margin-left:auto; margin-right:auto; }
  .timer-big { font-size: clamp(60px, 13vw, 180px); font-weight: 900; font-variant-numeric: tabular-nums; margin-top: 30px; }
  table.wide { width:100%; border-collapse: collapse; font-size: clamp(16px, 1.8vw, 24px); margin-top: 20px; }
  table.wide th, table.wide td { padding: 12px 10px; border-bottom: 2px solid var(--line); text-align:center; }
  table.wide th:first-child, table.wide td:first-child { text-align:left; }
  .ok { color: #2E7D74; font-weight: 900; }
  .no { color: #B24C63; font-weight: 900; }
  .lb-list { display:flex; flex-direction:column; gap: 14px; max-width: 700px; margin: 20px auto 0; }
  .lb-row { display:flex; align-items:center; gap: 20px; padding: 16px 26px; border-radius: 16px; background:white; border: 2px solid var(--line); }
  .lb-row.first { background: var(--yellow-soft); border-color: var(--yellow); }
  .lb-rank { font-weight: 900; font-size: 28px; width: 46px; color: var(--ink-soft); }
  .lb-name { flex:1; font-weight: 800; font-size: 26px; text-align:left; }
  .lb-points { font-weight: 900; font-size: 30px; }
  .dot { width: 20px; height:20px; border-radius:50%; display:inline-block; }
  .order-row { display:flex; align-items:center; gap:16px; justify-content:center; font-size: 22px; margin-bottom: 10px; }

  /* Kleine, dauerhafte Countdown-Leiste unten, unabhängig von der jeweils aktiven Ansicht/Box.
     Startet die Regie den Timer, läuft dieselbe Zeit synchron auf den Team-Handys mit. */
  body { padding-bottom: 100px; }
  .countdown-bar { position: fixed; left:0; right:0; bottom:0; height: 46px; background: var(--bg);
    border-top: 2px solid var(--line); display:flex; align-items:center; justify-content:center;
    z-index: 100; overflow:hidden; }
  .countdown-bar .fill { position:absolute; left:0; top:0; bottom:0; width:0%; background: var(--teal);
    opacity:0.35; transition: width 0.25s linear; }
  .countdown-bar span { position:relative; font-weight:900; font-variant-numeric: tabular-nums; font-size:20px; }
  .countdown-bar.idle span { color: var(--ink-soft); }
</style>
</head>
<body>
<div class="wrap" id="app">Lädt…</div>
<div class="countdown-bar idle" id="countdownBar">
  <div class="fill" id="countdownFill"></div>
  <span id="countdownText">--:--</span>
</div>

let teams = {}, gameState = { activeGameId: null, phase: 'idle', round: 1 }, gameData = {};

db.ref('teams').on('value', s => { teams = s.val() || {}; render(); });
db.ref('gameState').on('value', s => { gameState = Object.assign({ activeGameId: null, phase: 'idle', round: 1 }, s.val() || {}); render(); });
db.ref('games').on('value', s => { gameData = s.val() || {}; render(); });

function teamColor(t) { return (TEAM_COLORS.find(c => c.id === t.colorId) || {}).hex || '#ccc'; }

function idleView() {
  return `<div class="eyebrow-big">Spieleabend</div><div class="title-big">Erobere die<br>Christusgemeinde<br>Hemmingen</div>${TEAM_QR_BLOCK}`;
}

function rulesView(game) {
  const video = game.videoUrl ? `
    <div style="margin-top: 24px; display:flex; justify-content:center;">
      <video src="${game.videoUrl}" controls autoplay style="max-width: 720px; width: 100%; border-radius: 16px; border: 3px solid ${game.accent};"
        onloadedmetadata="this.playbackRate = ${game.videoRate || 1};" onplay="this.playbackRate = ${game.videoRate || 1};"></video>
    </div>
  ` : '';
  return `
    <div class="eyebrow-big" style="color:${game.accent};">${escapeHtml(game.sub)}</div>
    <div class="title-big">${escapeHtml(game.name)}</div>
    <div class="rule-big">${escapeHtml(game.rule)}</div>
    ${video}
  `;
}

function activeView(game) {
  document.documentElement.style.setProperty('--accent', game.accent);
  if (game.type === 'taste') return tasteView(game);
  if (game.type === 'buzzer') return buzzerActiveView(game);
  if (game.type === 'quiz') return quizView(game);
  if (game.type === 'race') return raceActiveView(game);
  if (game.type === 'manual') return manualActiveView(game);
  if (game.type === 'value') return valueActiveView(game);
  if (game.type === 'grouprace') return groupRaceActiveView(game);
  if (game.type === 'guess') return guessActiveView(game);
  return `
    <div class="eyebrow-big" style="color:${game.accent};">${escapeHtml(game.sub)}</div>
    <div class="title-big">${escapeHtml(game.name)}</div>
    <div class="timer-big" id="timerBig">--:--</div>
  `;
}

function groupStatusText(g) {
  const groups = g.groups || [];
  const groupIndex = g.currentGroupIndex || 0;
  if (!groups.length) return 'Gruppen werden gleich ausgelost';
  if (groupIndex >= groups.length) return 'Alle Gruppen sind dran gewesen';
  const names = groups[groupIndex].map(id => escapeHtml((teams[id] || {}).name || id)).join(', ');
  return `Gruppe ${groupIndex + 1} von ${groups.length} ist dran: ${names}`;
}

// Zeigt die ausgeloste Reihenfolge/Gruppen dauerhaft an, damit alle sehen, in welcher
// Reihenfolge gespielt wird (nicht nur, wer gerade dran ist).
function raceOrderBlock(order, currentIndex, values) {
  if (!order.length) return '';
  return `
    <div style="margin-top:22px; max-width:760px; margin-left:auto; margin-right:auto; text-align:left;">
      <div style="font-weight:800; text-transform:uppercase; letter-spacing:0.08em; font-size:16px; color:var(--ink-soft); margin-bottom:8px; text-align:center;">Ausgeloste Reihenfolge</div>
      ${order.map((id, i) => {
        const t = teams[id] || {};
        const isCurrent = i === currentIndex;
        const isDone = values[id] !== undefined && values[id] !== null && values[id] !== '';
        return `<div class="order-row" style="justify-content:flex-start; ${isCurrent ? 'font-weight:900;' : ''}">
          <span style="width:30px; text-align:right;">${i + 1}.</span>
          <span class="dot" style="background:${teamColor(t)};"></span>
          <span style="flex:1; text-align:left;">${escapeHtml(t.name || '')}</span>
          <span>${isCurrent ? '▶ jetzt dran' : isDone ? '✓' : ''}</span>
        </div>`;
      }).join('')}
    </div>
  `;
}
function groupsListBlock(groups, currentGroupIndex) {
  if (!groups.length) return '';
  return `
    <div style="margin-top:22px; max-width:900px; margin-left:auto; margin-right:auto; display:flex; flex-direction:column; gap:8px; text-align:left;">
      <div style="font-weight:800; text-transform:uppercase; letter-spacing:0.08em; font-size:16px; color:var(--ink-soft); margin-bottom:2px; text-align:center;">Ausgeloste Gruppen</div>
      ${groups.map((grp, i) => {
        const isCurrent = i === currentGroupIndex;
        const names = grp.map(id => `<span class="dot" style="background:${teamColor(teams[id] || {})};"></span> ${escapeHtml((teams[id] || {}).name || '')}`).join('&nbsp;&nbsp;&nbsp;');
        return `<div class="order-row" style="justify-content:flex-start; ${isCurrent ? 'font-weight:900;' : ''}">
          <span style="width:120px; text-align:left;">Gruppe ${i + 1}${isCurrent ? ' ▶' : ''}</span>
          <span style="flex:1; text-align:left;">${names}</span>
        </div>`;
      }).join('')}
    </div>
  `;
}

function manualActiveView(game) {
  const g = gameData[game.id] || {};
  return `
    <div class="eyebrow-big" style="color:${game.accent};">${escapeHtml(game.sub)}</div>
    <div class="title-big">${escapeHtml(game.name)}</div>
    <div class="rule-big">${groupStatusText(g)}</div>
    <div class="timer-big" id="timerBig">--:--</div>
  `;
}

function valueActiveView(game) {
  const g = gameData[game.id] || {};
  const values = g.values || {};
  const ranked = Object.entries(values).filter(([, v]) => v !== undefined && v !== null && v !== '')
    .sort((a, b) => game.higherIsBetter ? b[1] - a[1] : a[1] - b[1]);
  return `
    <div class="eyebrow-big" style="color:${game.accent};">${escapeHtml(game.sub)}</div>
    <div class="title-big">${escapeHtml(game.name)}</div>
    <div class="rule-big">${groupStatusText(g)}</div>
    <table class="wide" style="margin-top:20px;"><thead><tr><th>Platz</th><th>Team</th><th>${escapeHtml(game.valueLabel)}</th></tr></thead><tbody>
      ${ranked.map(([id, v], i) => `
        <tr><td>${i + 1}.</td><td><span class="dot" style="background:${teamColor(teams[id] || {})};"></span> ${escapeHtml((teams[id] || {}).name || '')}</td><td>${v}</td></tr>
      `).join('') || `<tr><td colspan="3">Noch keine Werte.</td></tr>`}
    </tbody></table>
    ${groupsListBlock(g.groups || [], g.currentGroupIndex || 0)}
  `;
}

function raceActiveView(game) {
  const g = gameData[game.id] || {};
  const times = g.values || {};
  const order = g.order || [];
  const currentIndex = g.currentIndex || 0;
  const currentTeam = teams[order[currentIndex]] || {};
  const isDone = !order.length || currentIndex >= order.length;
  const ranked = Object.entries(times).filter(([, v]) => v !== undefined && v !== null && v !== '').sort((a, b) => a[1] - b[1]);
  const status = !order.length ? 'Reihenfolge wird gleich ausgelost'
    : isDone ? 'Alle Teams sind gefahren'
    : `${escapeHtml(currentTeam.name || '')} ist dran, Team ${currentIndex + 1} von ${order.length}`;
  return `
    <div class="eyebrow-big" style="color:${game.accent};">${escapeHtml(game.sub)}</div>
    <div class="title-big">${escapeHtml(game.name)}</div>
    <div class="rule-big">${status}</div>
    <table class="wide" style="margin-top:20px;"><thead><tr><th>Platz</th><th>Team</th><th>Zeit</th></tr></thead><tbody>
      ${ranked.map(([id, t], i) => `
        <tr><td>${i + 1}.</td><td><span class="dot" style="background:${teamColor(teams[id] || {})};"></span> ${escapeHtml((teams[id] || {}).name || '')}</td><td>${t} s</td></tr>
      `).join('') || `<tr><td colspan="3">Noch keine Zeiten.</td></tr>`}
    </tbody></table>
    ${raceOrderBlock(order, currentIndex, times)}
  `;
}

function groupRaceActiveView(game) {
  const g = gameData[game.id] || {};
  const values = g.values || {};
  const running = !!g.currentStart;
  const ranked = Object.entries(values).filter(([, v]) => v !== undefined && v !== null && v !== '').sort((a, b) => a[1] - b[1]);
  return `
    <div class="eyebrow-big" style="color:${game.accent};">${escapeHtml(game.sub)}</div>
    <div class="title-big">${escapeHtml(game.name)}</div>
    <div class="rule-big">${groupStatusText(g)}${running ? ' — Zeitnahme läuft…' : ''}</div>
    <table class="wide" style="margin-top:20px;"><thead><tr><th>Platz</th><th>Team</th><th>Zeit</th></tr></thead><tbody>
      ${ranked.map(([id, t], i) => `
        <tr><td>${i + 1}.</td><td><span class="dot" style="background:${teamColor(teams[id] || {})};"></span> ${escapeHtml((teams[id] || {}).name || '')}</td><td>${t} s</td></tr>
      `).join('') || `<tr><td colspan="3">Noch keine Zeiten.</td></tr>`}
    </tbody></table>
    ${groupsListBlock(g.groups || [], g.currentGroupIndex || 0)}
  `;
}

function quizView(game) {
  const answers = ((gameData.quiz || {}).answers) || {};
  const teamCount = Object.keys(teams).length;
  const totalPossible = QUIZ_QUESTIONS.length * (teamCount || 1);
  let answeredTotal = 0;
  QUIZ_QUESTIONS.forEach((_, idx) => { answeredTotal += Object.keys(answers[idx] || {}).length; });
  return `
    <div class="eyebrow-big" style="color:${game.accent};">${escapeHtml(game.sub)}</div>
    <div class="title-big">${escapeHtml(game.name)}</div>
    <div class="rule-big">Alle ${QUIZ_QUESTIONS.length} Fragen stehen auf euren Handys, jedes Team in eigenem Tempo</div>
    <div class="timer-big" id="timerBig">--:--</div>
    <div class="rule-big">${answeredTotal} von ${totalPossible} Antworten insgesamt eingegangen</div>
  `;
}

function closedView(game) {
  if (!game) return `<div class="title-big">Wird ausgewertet…</div>`;
  if (game.type === 'buzzer') return buzzerRevealView(game);
  return gameResultView(game);
}

// Rundenauswertung, zeigt Platz 1 bis 3 der aktuellen Box mit Punkten. Losgelöst von der
// Gesamtwertung über alle Boxen, dahin wechselt die Regie danach manuell über "Rangliste zeigen".
function gameResultView(game) {
  const g = gameData[game.id] || {};
  const placements = g.placements || {};
  const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };
  const rows = [1, 2, 3].flatMap(p => (placements[p] || []).map(id => ({ p, id })));
  return `
    <div class="eyebrow-big" style="color:${game.accent};">${escapeHtml(game.sub)}</div>
    <div class="title-big" style="font-size: clamp(34px,5vw,60px);">Rundenauswertung</div>
    <div class="lb-list" style="margin-top:20px;">
      ${rows.length ? rows.map(({ p, id }) => {
        const t = teams[id] || {};
        const isPrio = (t.prios || []).includes(game.id);
        const pts = pointsForPlacement(p, isPrio);
        return `
          <div class="lb-row ${p === 1 ? 'first' : ''}">
            <div class="lb-rank">${medals[p]}</div>
            <span class="dot" style="background:${teamColor(t)};"></span>
            <div class="lb-name">${escapeHtml(t.name || '?')}</div>
            <div class="lb-points">${pts} Pkt.</div>
          </div>
        `;
      }).join('') : '<div class="rule-big">Noch keine Platzierung übernommen.</div>'}
    </div>
  `;
}

function tasteView(game) {
  const t = gameData.taste || {};
  const revealedIndex = t.revealedIndex || 0;
  const answers = t.answers || {};
  const overrides = t.overrides || {};
  const ready = t.ready || {};
  const rows = Object.entries(teams).map(([id, tm]) => {
    const teamAnswers = (answers[id] || []);
    const cells = TASTE_FOODS.map((food, i) => {
      if (i >= revealedIndex) return `<td>?</td>`;
      // Reihenfolge der Antworten ist egal, es zählt nur, ob das Team dieses Lebensmittel
      // irgendwo eingetragen hat.
      const matchedGuess = findTasteMatch(teamAnswers, food);
      const auto = !!matchedGuess;
      const isCorrect = overrides[id + '_' + i] !== undefined ? overrides[id + '_' + i] : auto;
      return `<td class="${isCorrect ? 'ok' : 'no'}">${escapeHtml(matchedGuess || (isCorrect ? '✓' : '–'))}</td>`;
    }).join('');
    return `<tr><td><span class="dot" style="background:${teamColor(tm)};"></span> ${escapeHtml(tm.name)}${ready[id] ? ' ✓' : ''}</td>${cells}</tr>`;
  }).join('');
  return `
    <div class="eyebrow-big" style="color:${game.accent};">${escapeHtml(game.sub)}</div>
    <div class="title-big" style="font-size: clamp(34px, 5vw, 60px);">${escapeHtml(game.name)}</div>
    <table class="wide"><thead><tr><th>Team</th>${TASTE_FOODS.map((_, i) => `<th>${i + 1}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
  `;
}

function numbersBlock(game, round) {
  const numbersRound = game.numbersRounds && game.numbersRounds[round - 1];
  if (!numbersRound) return '';
  return `
    <div class="rule-big" style="margin-top:14px;">Zielzahl</div>
    <div class="timer-big" style="font-size: clamp(50px,10vw,120px); margin-top:0;">${numbersRound.target}</div>
    <div class="rule-big" style="font-size: clamp(26px,4vw,46px); font-weight:900; letter-spacing:0.04em; color:${game.accent};">${numbersRound.numbers.join('  ·  ')}</div>
    ${gameState.numbersReveal ? `<div class="rule-big" style="margin-top:18px;"><strong>Auflösung:</strong> ${escapeHtml(numbersRound.solution)}</div>` : ''}
  `;
}

// Baut die Buzz-Rangliste (wer zuerst gebuzzert hat) als HTML-Zeilen, wiederverwendet für
// die dauerhafte Auswertung (buzzerRevealView) und die Live-Anzeige während der Runde.
function buzzOrderRows(game, round) {
  const roundData = (((gameData[game.id] || {}).rounds || {})[round]) || {};
  const buzzes = roundData.buzzes || {};
  const marks = roundData.marks || {};
  const order = Object.entries(buzzes).sort((a, b) => a[1] - b[1]);
  const base = order.length ? order[0][1] : 0;
  const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };
  let correctRank = 0;
  return order.map(([id, ts], i) => {
    let status = '';
    if (marks[id] === 'correct') { correctRank++; status = medals[correctRank] || '✓'; }
    else if (marks[id] === 'wrong') { status = '✗'; }
    return `<div class="order-row"><span class="dot" style="background:${teamColor(teams[id] || {})};"></span>
      <span style="flex:1; text-align:left;">${i + 1}. ${escapeHtml((teams[id] || {}).name || '')}</span>
      <span>+${((ts - base) / 1000).toFixed(1)}s</span><span>${status}</span></div>`;
  }).join('');
}

// Baut die Rangliste für Zahlen-Eingabe-Runden (z.B. Numbers Game Runde 3): sortiert nach
// Abstand zur Zielzahl, ohne Buzzer. Zeigt keine Namen der Konkurrenz-Eingaben vorher live an,
// nur nach dem Aufdecken (analog zu buzzOrderRows für Buzzer-Runden).
function closestValueRows(game, round, target) {
  const roundData = (((gameData[game.id] || {}).rounds || {})[round]) || {};
  const answers = roundData.answers || {};
  const entries = Object.entries(answers).filter(([, v]) => v !== undefined && v !== null && v !== '')
    .map(([id, v]) => [id, v, Math.abs(v - target)])
    .sort((a, b) => a[2] - b[2]);
  const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };
  return entries.map(([id, v, diff], i) => `
    <div class="order-row"><span class="dot" style="background:${teamColor(teams[id] || {})};"></span>
      <span style="flex:1; text-align:left;">${i + 1}. ${escapeHtml((teams[id] || {}).name || '')}</span>
      <span>${v}</span><span>${medals[i + 1] || ''}</span></div>
  `).join('');
}

function buzzerActiveView(game) {
  const round = gameState.round || 1;
  const roundConfig = game.numbersRounds && game.numbersRounds[round - 1];
  const isClosestRound = !!(roundConfig && roundConfig.mode === 'closest');
  const buzzes = (((gameData[game.id] || {}).rounds || {})[round] || {}).buzzes || {};
  const answers = (((gameData[game.id] || {}).rounds || {})[round] || {}).answers || {};
  const answeredCount = isClosestRound ? Object.keys(answers).length : Object.keys(buzzes).length;
  const label = game.roundLabel ? game.roundLabel + ' ' + round : 'Runde ' + round + ' von ' + game.rounds;
  const song = game.songs && game.songs[round - 1];
  const audio = song ? `
    <audio data-song-url="${escapeHtml(song.url)}" src="${song.url}" controls autoplay style="margin-top: 24px; width: 100%; max-width: 560px;"></audio>
    <div class="rule-big" style="font-size: clamp(14px,1.4vw,18px); margin-top:6px; opacity:0.7;">Spielt der Beamer-Ton nicht automatisch, einmal auf Play tippen.</div>
  ` : '';
  const isNumbers = !!roundConfig;
  const buzzOrderBlock = (!isClosestRound && gameState.buzzOrderReveal) ? `
    <div class="rule-big" style="margin-top:18px; font-weight:800;">Wer war zuerst?</div>
    <div style="margin-top:10px;">${buzzOrderRows(game, round) || '<div class="rule-big">Niemand hat gebuzzert.</div>'}</div>
  ` : '';
  const statusText = isClosestRound
    ? `${answeredCount} Team${answeredCount === 1 ? '' : 's'} ${answeredCount === 1 ? 'hat' : 'haben'} eine Zahl eingetragen`
    : `${answeredCount} Team${answeredCount === 1 ? '' : 's'} ${answeredCount === 1 ? 'hat' : 'haben'} gebuzzert`;
  return `
    <div class="eyebrow-big" style="color:${game.accent};">${escapeHtml(game.sub)}</div>
    <div class="title-big">${escapeHtml(game.name)}</div>
    <div class="rule-big">${label}${isNumbers ? '' : ', hört gut zu'}</div>
    ${audio}
    ${numbersBlock(game, round)}
    <div class="rule-big" style="margin-top:6px;">Verbleibende Zeit</div>
    <div class="timer-big" id="timerBig" style="font-size: clamp(40px,8vw,100px); margin-top:0;">--:--</div>
    <div class="rule-big">${statusText}</div>
    ${buzzOrderBlock}
  `;
}

function buzzerRevealView(game) {
  const round = gameState.round || 1;
  const roundConfig = game.numbersRounds && game.numbersRounds[round - 1];
  const isClosestRound = !!(roundConfig && roundConfig.mode === 'closest');
  const rows = isClosestRound ? closestValueRows(game, round, roundConfig.target) : buzzOrderRows(game, round);
  const song = game.songs && game.songs[round - 1];
  const reveal = song ? `<div class="rule-big" style="margin-top:-6px;">Das Original: <strong>${escapeHtml(song.title)}</strong></div>` : '';
  const title = isClosestRound ? 'Wer war am nächsten dran?' : 'Wer war zuerst?';
  const emptyText = isClosestRound ? 'Niemand hat eine Zahl eingetragen.' : 'Niemand hat gebuzzert.';
  return `
    <div class="eyebrow-big" style="color:${game.accent};">${escapeHtml(game.sub)}</div>
    <div class="title-big" style="font-size: clamp(34px,5vw,60px);">${title}</div>
    ${reveal}
    ${numbersBlock(game, round)}
    <div style="margin-top: 24px;">${rows || `<div class="rule-big">${emptyText}</div>`}</div>
  `;
}

// ---------- KI-Songs: Texteingabe statt Buzzer ----------
// Wie buzzerActiveView, aber ohne Buzzer-Button - die Teams tippen den Titel auf ihrem eigenen
// Gerät ein. Titel werden hier NIE angezeigt, nur die Anzahl der bereits eingegangenen Antworten.
function guessActiveView(game) {
  const round = gameState.round || 1;
  const guesses = (((gameData[game.id] || {}).rounds || {})[round] || {}).guesses || {};
  const label = game.roundLabel ? game.roundLabel + ' ' + round : 'Runde ' + round + ' von ' + game.rounds;
  const song = game.songs && game.songs[round - 1];
  const audio = song ? `
    <audio data-song-url="${escapeHtml(song.url)}" src="${song.url}" controls autoplay style="margin-top: 24px; width: 100%; max-width: 560px;"></audio>
    <div class="rule-big" style="font-size: clamp(14px,1.4vw,18px); margin-top:6px; opacity:0.7;">Spielt der Beamer-Ton nicht automatisch, einmal auf Play tippen.</div>
  ` : '';
  const count = Object.keys(guesses).length;
  return `
    <div class="eyebrow-big" style="color:${game.accent};">${escapeHtml(game.sub)}</div>
    <div class="title-big">${escapeHtml(game.name)}</div>
    <div class="rule-big">${label}, tragt den Titel auf eurem Gerät ein</div>
    ${audio}
    <div class="rule-big" style="margin-top:6px;">Verbleibende Zeit</div>
    <div class="timer-big" id="timerBig" style="font-size: clamp(40px,8vw,100px); margin-top:0;">--:--</div>
    <div class="rule-big">${count} Team${count === 1 ? '' : 's'} ${count === 1 ? 'hat' : 'haben'} schon geantwortet</div>
  `;
}

function leaderboardView() {
  const totals = {};
  Object.keys(teams).forEach(id => totals[id] = 0);
  GAMES.forEach(g => {
    const placements = ((gameData[g.id] || {}).placements) || {};
    [1, 2, 3].forEach(p => {
      (placements[p] || []).forEach(id => {
        if (teams[id]) totals[id] = (totals[id] || 0) + pointsForPlacement(p, (teams[id].prios || []).includes(g.id));
      });
    });
  });
  const ranked = withRanks(Object.entries(totals).sort((a, b) => b[1] - a[1]));
  return `
    <div class="eyebrow-big">Rangliste</div>
    <div class="title-big" style="font-size: clamp(34px,5vw,60px);">Wer erobert die Gemeinde?</div>
    <div class="lb-list">
      ${ranked.map(([id, pts, rang]) => `
        <div class="lb-row ${rang === 1 ? 'first' : ''}">
          <div class="lb-rank">${rang}.</div>
          <span class="dot" style="background:${teamColor(teams[id] || {})};"></span>
          <div class="lb-name">${escapeHtml((teams[id] || {}).name || '?')}</div>
          <div class="lb-points">${pts} Pkt.</div>
        </div>
      `).join('') || '<div class="rule-big">Noch keine Punkte.</div>'}
    </div>
  `;
}

// Sichtbare Zufallsauslosung: solange die aktive Box "drawing" gesetzt hat, läuft hier eine
// Zufalls-Animation, damit alle im Raum sehen, dass die Gruppen wirklich live ausgelost werden.
function drawingView(game) {
  const ids = Object.keys(teams);
  const highlightId = ids.length ? ids[Math.floor(Math.random() * ids.length)] : null;
  const chips = ids.map(id => {
    const t = teams[id] || {};
    const active = id === highlightId;
    const size = active ? 40 : 22;
    return `<span class="dot" style="background:${teamColor(t)}; width:${size}px; height:${size}px; margin:6px; transition: all 0.1s;"></span>`;
  }).join('');
  return `
    <div class="eyebrow-big" style="color:${game.accent};">${escapeHtml(game.sub)}</div>
    <div class="title-big" style="font-size: clamp(34px,5vw,60px);">Wird ausgelost…</div>
    <div style="margin-top: 30px; display:flex; justify-content:center; flex-wrap:wrap;">${chips || ''}</div>
  `;
}

// Zeigt live, wer gerade dran ist bzw. was gewählt wurde, aber NUR den Namen/das Thema
// der Box, nie die Spielregeln (die Teams sollen die Regeln erst live erfahren).
function pickerLiveBlock() {
  const pickerId = gameState.currentPicker;
  if (!pickerId) return '';
  const team = teams[pickerId] || {};
  if (gameState.pickerChoice) {
    const chosen = gameById(gameState.pickerChoice);
    return `
      <div class="rule-big" style="margin-top:14px;">
        <span class="dot" style="background:${teamColor(team)};"></span>
        <strong>${escapeHtml(team.name || '?')}</strong> hat <strong>${escapeHtml(chosen ? chosen.sub : '?')}</strong> gewählt
      </div>
    `;
  }
  return `
    <div class="rule-big" style="margin-top:14px;">
      <span class="dot" style="background:${teamColor(team)};"></span>
      <strong>${escapeHtml(team.name || '?')}</strong> wählt gerade die nächste Box aus …
    </div>
  `;
}
function roomsView() {
  return `
    <div class="eyebrow-big">Räume-Übersicht</div>
    <div class="title-big" style="font-size: clamp(34px,5vw,60px);">Welche Box kommt als Nächstes?</div>
    ${pickerLiveBlock()}
    <div class="lb-list" style="margin-top:20px; max-width:900px;">
      ${GAMES.map(g => {
        const done = !!((gameData[g.id] || {}).done);
        return `
          <div class="lb-row" style="opacity:${done ? 0.45 : 1};">
            <span class="dot" style="background:${g.accent};"></span>
            <div class="lb-name">${escapeHtml(g.name)}, ${escapeHtml(g.sub)}</div>
            <div class="lb-points">${done ? 'Vergeben' : 'Offen'}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function render() {
  const game = gameById(gameState.activeGameId);
  const g = (game && gameData[game.id]) || {};
  const drawing = !!(game && g.drawing);

  if (drawing && !window._drawInterval) {
    window._drawInterval = setInterval(render, 120);
  }
  if (!drawing && window._drawInterval) {
    clearInterval(window._drawInterval);
    window._drawInterval = null;
  }

  let html;
  if (drawing) html = drawingView(game);
  else if (gameState.phase === 'leaderboard') html = leaderboardView();
  else if (gameState.phase === 'rooms') html = roomsView();
  else if (!game || gameState.phase === 'idle') html = idleView();
  else if (gameState.phase === 'rules') html = rulesView(game);
  else if (gameState.phase === 'closed') html = closedView(game);
  else if (gameState.phase === 'active') html = activeView(game);
  else html = idleView();

  // Jedes Firebase-Update (z.B. ein Buzz) baut den Bildschirm komplett neu auf, was sonst
  // das <audio>-Element neu erzeugt und den Song von vorne startet. Deshalb Abspielposition
  // vorher merken und danach wiederherstellen, statt den Song neu zu starten.
  const app = document.getElementById('app');
  const prevAudio = app.querySelector('audio');
  const prevAudioState = prevAudio ? { url: prevAudio.dataset.songUrl, time: prevAudio.currentTime, paused: prevAudio.paused } : null;

  app.innerHTML = html;

  const newAudio = app.querySelector('audio');
  if (newAudio && prevAudioState && prevAudioState.url && newAudio.dataset.songUrl === prevAudioState.url) {
    newAudio.currentTime = prevAudioState.time;
    if (prevAudioState.paused) newAudio.pause();
    else newAudio.play().catch(() => {});
  }
}
render();

setInterval(() => {
  const el = document.getElementById('timerBig');
  if (!el) return;
  if (gameState.timerEndsAt) el.textContent = fmtTime((gameState.timerEndsAt - Date.now()) / 1000);
  else el.textContent = fmtTime(gameState.timerDuration || 0);
}, 250);

// ---------- Kleine, dauerhafte Countdown-Leiste ----------
// Unabhängig von render()/innerHTML (liegt außerhalb von #app), damit sie bei jeder Box/Phase
// sichtbar bleibt und nicht durch andere Updates stockt. Dieselben Firebase-Felder wie die
// Team-Handys, damit beide synchron laufen.
function updateCountdownBar() {
  const bar = document.getElementById('countdownBar');
  const fill = document.getElementById('countdownFill');
  const text = document.getElementById('countdownText');
  if (!bar || !fill || !text) return;
  const total = gameState.timerDuration || 0;
  const running = !!gameState.timerEndsAt;
  const remaining = running ? Math.max(0, (gameState.timerEndsAt - Date.now()) / 1000) : total;
  text.textContent = fmtTime(remaining);
  const pct = total > 0 ? Math.max(0, Math.min(100, (remaining / total) * 100)) : 0;
  fill.style.width = pct + '%';
  bar.classList.toggle('idle', !running);
}
setInterval(updateCountdownBar, 250);
updateCountdownBar();
</script>
</body>
</html>
