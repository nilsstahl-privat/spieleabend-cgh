<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Spieleabend, Team</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* Handy-first (Hochformat): Geräte sind normale Smartphones der Teams, keine iPads/Querformat. */
  body { padding: 16px 14px 60px; }
  .wrap { max-width: 480px; margin: 0 auto; }
  .logo-row { text-align: center; margin-bottom: 20px; }
  .logo-row h1 { font-size: 21px; line-height: 1.2; }
  .logo-row .eyebrow { display:block; margin-bottom: 6px; }

  .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
  .color-swatch {
    aspect-ratio: 1; border-radius: 14px; border: 3px solid transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 800; font-size: 22px; min-height: 64px;
  }
  .color-swatch.taken { opacity: 0.25; cursor: not-allowed; }
  .color-swatch.selected { border-color: var(--ink); }

  .field { margin: 16px 0; }
  .field label { display:block; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin-bottom: 6px; }
  .field input { width: 100%; min-height: 48px; font-size: 16px; }

  .prio-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 16px 0; }
  .prio-btn {
    display: flex; align-items: center; justify-content: space-between;
    background: white; border: 2px solid var(--line); border-radius: 12px;
    padding: 18px 18px; cursor: pointer; font-weight: 700; min-height: 56px; font-size: 17px;
  }
  .prio-btn.picked { border-color: var(--ink); background: var(--yellow-soft); }
  .prio-btn .sub { font-weight: 400; color: var(--ink-soft); font-size: 12px; }
  .prio-count { text-align:center; color: var(--ink-soft); font-size: 13px; margin-bottom: 6px; }

  .stage-badge { display:inline-block; background: var(--ink); color: white; border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 800; margin-bottom: 14px; }
  .big-title { font-size: clamp(24px, 7vw, 36px); line-height: 1.1; margin: 6px 0 10px; }
  .rule-text { font-size: 16px; line-height: 1.5; color: var(--ink-soft); }
  .timer-big { font-size: clamp(40px, 14vw, 60px); font-weight: 900; text-align: center; margin: 18px 0; font-variant-numeric: tabular-nums; }

  .buzzer-btn {
    width: 100%; max-width: 480px; margin: 20px auto 0; display:block; aspect-ratio: 2; border-radius: 28px; font-size: 30px; font-weight: 900;
    text-transform: uppercase; letter-spacing: 0.04em; min-height: 90px;
  }
  .buzzer-btn.locked { background: var(--line); color: var(--ink-soft); }

  .taste-slot { display:flex; gap: 10px; margin-bottom: 10px; align-items:center; }
  .taste-slot input { flex:1; min-height: 48px; font-size: 16px; }
  .taste-slot .n { width: 24px; font-weight: 800; color: var(--ink-soft); }

  .team-chip { display:flex; align-items:center; gap:10px; padding: 12px 16px; background: white; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 10px; }
  .team-dot { width: 18px; height:18px; border-radius:50%; flex-shrink:0; }
  .team-chip .name { font-weight: 800; flex:1; }
  .team-chip .points { font-weight: 900; }

  .save-note { text-align:center; font-size: 12px; color: var(--ink-soft); margin-top: 10px; height: 16px; }

  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 0 rgba(253,226,53,0); }
    50% { box-shadow: 0 0 50px 14px rgba(253,226,53,0.8); }
  }
  .picker-glow { animation: pulseGlow 1.1s ease-in-out infinite; background: var(--yellow-soft) !important; }

  /* Kleine, dauerhafte Countdown-Leiste unten, läuft synchron zur Präsentationsfolie mit
     (gleiche Firebase-Felder gameState.timerEndsAt/timerDuration). */
  body { padding-bottom: 90px; }
  .countdown-bar { position: fixed; left:0; right:0; bottom:0; height: 40px; background: var(--bg);
    border-top: 2px solid var(--line); display:flex; align-items:center; justify-content:center;
    z-index: 100; overflow:hidden; }
  .countdown-bar .fill { position:absolute; left:0; top:0; bottom:0; width:0%; background: var(--teal);
    opacity:0.35; transition: width 0.25s linear; }
  .countdown-bar span { position:relative; font-weight:900; font-variant-numeric: tabular-nums; font-size:16px; }
  .countdown-bar.idle span { color: var(--ink-soft); }
</style>
</head>
<body>
<div class="wrap" id="app">Lädt…</div>
<div class="countdown-bar idle" id="countdownBar">
  <div class="fill" id="countdownFill"></div>
  <span id="countdownText">--:--</span>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="shared.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const LS_KEY = 'spieleabend_teamId';
let teamId = localStorage.getItem(LS_KEY);
if (!teamId) {
  teamId = 'team_' + Math.random().toString(36).slice(2, 10);
  localStorage.setItem(LS_KEY, teamId);
}

let teamsSnapshot = {};
let myTeam = null;
let gameState = { activeGameId: null, phase: 'idle', timerEndsAt: null, timerDuration: null, round: 1, priosReleased: false, currentPicker: null, pickerChoice: null };
let gameData = {}; // /games snapshot
let connected = true;

const app = document.getElementById('app');

db.ref('teams').on('value', snap => {
  teamsSnapshot = snap.val() || {};
  myTeam = teamsSnapshot[teamId] || null;
  render();
});
let pickerChoiceAt = null;
let pickerChoiceTimer = null;
db.ref('gameState').on('value', snap => {
  const prevChoice = gameState.pickerChoice;
  gameState = Object.assign({ activeGameId: null, phase: 'idle', round: 1, priosReleased: false, currentPicker: null, pickerChoice: null }, snap.val() || {});
  if (gameState.pickerChoice && gameState.pickerChoice !== prevChoice) {
    // Bestätigung "Ihr habt X gewählt" nur kurz zeigen, danach automatisch zurück zum normalen Bildschirm.
    pickerChoiceAt = Date.now();
    if (pickerChoiceTimer) clearTimeout(pickerChoiceTimer);
    pickerChoiceTimer = setTimeout(render, 3100);
  }
  if (!gameState.pickerChoice) {
    pickerChoiceAt = null;
    if (pickerChoiceTimer) { clearTimeout(pickerChoiceTimer); pickerChoiceTimer = null; }
  }
  render();
});
db.ref('games').on('value', snap => {
  gameData = snap.val() || {};
  render();
});
db.ref('.info/connected').on('value', snap => {
  connected = snap.val() === true;
  render();
});
function connBadgeHtml() {
  return `<div class="small" style="text-align:center; margin-bottom:10px; font-weight:800; color:${connected ? '#2E7D74' : '#B24C63'};">${connected ? '● verbunden' : '● keine Verbindung, prüft euer WLAN'}</div>`;
}

function takenColors() {
  return new Set(Object.entries(teamsSnapshot)
    .filter(([id]) => id !== teamId)
    .map(([, t]) => t.colorId));
}

function joinScreen() {
  const taken = takenColors();
  const draft = joinScreen._draft || { colorId: null, name: '' };
  joinScreen._draft = draft;

  return `
    <div class="logo-row">
      <span class="eyebrow">Spieleabend</span>
      <h1>Erobere die<br>Christusgemeinde<br>Hemmingen</h1>
    </div>
    <div class="panel">
      <div class="field"><label>Team-Name</label>
        <input id="nameInput" type="text" placeholder="Euer Team-Name" value="${escapeHtml(draft.name)}">
      </div>
      <div class="field"><label>Farbe wählen</label>
        <div class="color-grid">
          ${TEAM_COLORS.map(c => `
            <div class="color-swatch ${taken.has(c.id) ? 'taken' : ''} ${draft.colorId === c.id ? 'selected' : ''}"
              style="background:${c.hex};" data-color="${c.id}"
              onclick="${taken.has(c.id) ? '' : `pickColor('${c.id}')`}">
              ${draft.colorId === c.id ? '✓' : ''}
            </div>
          `).join('')}
        </div>
      </div>
      <button style="width:100%;" onclick="joinTeam()">Team anmelden</button>
    </div>
    <div class="panel" style="margin-top:14px;">
      <div class="small" style="text-align:center; margin-bottom:8px; cursor:pointer; text-decoration:underline;" onclick="toggleRejoin()">${joinScreen._showRejoin ? 'Ausblenden' : 'Schon angemeldet? Auf diesem Gerät weitermachen'}</div>
      ${joinScreen._showRejoin ? `
        <div class="field"><label>Euer Team-Name</label><input id="rejoinName" type="text" placeholder="Team-Name"></div>
        <div class="field"><label>4-stelliger Code</label><input id="rejoinCode" type="text" inputmode="numeric" maxlength="4" placeholder="0000"></div>
        <button class="ghost" style="width:100%;" onclick="rejoinTeam()">Weitermachen</button>
      ` : ''}
    </div>
  `;
}
function toggleRejoin() { joinScreen._showRejoin = !joinScreen._showRejoin; render(); }
function pickColor(id) { joinScreen._draft = Object.assign(joinScreen._draft || {}, { colorId: id }); render(); }
function joinTeam() {
  const name = document.getElementById('nameInput').value.trim();
  const draft = joinScreen._draft || {};
  if (!name) { alert('Bitte einen Team-Namen eingeben.'); return; }
  if (!draft.colorId) { alert('Bitte eine Farbe wählen.'); return; }
  const rejoinCode = String(Math.floor(1000 + Math.random() * 9000));
  db.ref('teams/' + teamId).set({
    name, colorId: draft.colorId, prios: [], joinedAt: firebase.database.ServerValue.TIMESTAMP, rejoinCode,
  }).catch(err => { console.error(err); alert('Anmeldung konnte nicht gespeichert werden, bitte nochmal versuchen.'); });
}
// Fallback bei Geräteverlust oder Neuladen auf einem anderen Gerät: Team-Name + Code
// holen den kompletten Stand (Punkte, Status, Prios) aus Firebase zurück, kein Login noetig.
function rejoinTeam() {
  const name = (document.getElementById('rejoinName').value || '').trim().toLowerCase();
  const code = (document.getElementById('rejoinCode').value || '').trim();
  if (!name || !code) { alert('Bitte Team-Name und Code eingeben.'); return; }
  const match = Object.entries(teamsSnapshot).find(([, t]) => (t.name || '').trim().toLowerCase() === name && String(t.rejoinCode || '') === code);
  if (!match) { alert('Kein Team mit diesem Namen und Code gefunden.'); return; }
  teamId = match[0];
  localStorage.setItem(LS_KEY, teamId);
  myTeam = match[1];
  render();
}
// keep name draft while typing
document.addEventListener('input', e => {
  if (e.target && e.target.id === 'nameInput') { joinScreen._draft = Object.assign(joinScreen._draft || {}, { name: e.target.value }); }
});

function prioWaitScreen() {
  return `
    <div class="panel" style="text-align:center; padding: 40px 20px;">
      <div class="eyebrow">Fast geschafft</div>
      <div class="big-title">Warte auf<br>Freigabe der Regie</div>
      <div class="rule-text">Gleich könnt ihr eure drei Prio-Boxen wählen.</div>
    </div>
  `;
}
function prioScreen() {
  const prios = myTeam.prios || [];
  return `
    <div class="panel">
      <div class="eyebrow">Eure Prio-Boxen</div>
      <h2 style="margin:8px 0 4px; font-size:20px;">Wählt genau drei</h2>
      <div class="prio-count">${prios.length} / 3 gewählt, danach fest gesperrt</div>
      <div class="small" style="text-align:center; margin-bottom:10px;">Welche Bereiche der Gemeinde sind euch am wichtigsten? Das Spiel dahinter bleibt eine Überraschung.</div>
      <div class="prio-grid">
        ${GAMES.map(g => `
          <div class="prio-btn ${prios.includes(g.id) ? 'picked' : ''}" onclick="togglePrio('${g.id}')">
            <span>${escapeHtml(g.sub)}</span>
            <span>${prios.includes(g.id) ? '✓' : ''}</span>
          </div>
        `).join('')}
      </div>
      <button style="width:100%;" ${prios.length !== 3 ? 'disabled' : ''} onclick="lockPrios()">Prios festlegen, geht danach nicht mehr</button>
    </div>
  `;
}
function pickerScreen() {
  if (gameState.pickerChoice) {
    const chosen = gameById(gameState.pickerChoice);
    return `
      <div class="panel picker-glow" style="text-align:center; padding: 40px 20px;">
        <div class="eyebrow">Danke!</div>
        <div class="big-title">Ihr habt<br>${escapeHtml(chosen ? chosen.sub : '')}<br>gewählt</div>
        <div class="rule-text">Die Regie startet gleich.</div>
      </div>
    `;
  }
  const openGames = GAMES.filter(g => !((gameData[g.id] || {}).done));
  return `
    <div class="panel picker-glow" style="text-align:center; padding: 26px 20px;">
      <div class="eyebrow">Ihr seid dran!</div>
      <div class="big-title">Wählt die<br>nächste Box</div>
      <div class="prio-grid" style="margin-top:16px;">
        ${openGames.map(g => `
          <div class="prio-btn" style="background:white;" onclick="pickNextGame('${g.id}')">
            <span>${escapeHtml(g.sub)}</span>
          </div>
        `).join('') || '<div class="rule-text">Keine offenen Boxen mehr.</div>'}
      </div>
    </div>
  `;
}
function pickNextGame(gameId) {
  if (gameState.currentPicker !== teamId || gameState.pickerChoice) return;
  db.ref('gameState/pickerChoice').set(gameId).catch(console.error);
}
function togglePrio(gameId) {
  let prios = (myTeam.prios || []).slice();
  const idx = prios.indexOf(gameId);
  if (idx >= 0) prios.splice(idx, 1);
  else { if (prios.length >= 3) return; prios.push(gameId); }
  db.ref('teams/' + teamId + '/prios').set(prios).catch(console.error);
}
function lockPrios() {
  if (!confirm('Prios wirklich festlegen? Das kann danach nicht mehr geändert werden.')) return;
  db.ref('teams/' + teamId + '/priosLocked').set(true).catch(err => { console.error(err); alert('Konnte nicht gespeichert werden, bitte nochmal versuchen.'); });
}

function myChip() {
  const color = (TEAM_COLORS.find(c => c.id === myTeam.colorId) || {}).hex || '#ccc';
  const total = computeMyPoints();
  return `
    <div class="team-chip">
      <div class="team-dot" style="background:${color};"></div>
      <div class="name">${escapeHtml(myTeam.name)}</div>
      <div class="points">${total} Pkt.</div>
    </div>
    ${myTeam.rejoinCode ? `<div class="small" style="text-align:center; margin: -4px 0 14px;">Code fürs Weitermachen auf einem anderen Gerät: <strong>${escapeHtml(myTeam.rejoinCode)}</strong></div>` : ''}
  `;
}

function computeMyPoints() {
  let total = 0;
  GAMES.forEach(g => {
    const placements = ((gameData[g.id] || {}).placements) || {};
    for (const p of [1, 2, 3]) {
      if ((placements[p] || []).includes(teamId)) total += pointsForPlacement(p, (myTeam.prios || []).includes(g.id));
    }
  });
  return total;
}

function liveScreen() {
  const game = gameById(gameState.activeGameId);
  let body = '';

  if (!game || gameState.phase === 'idle') {
    body = `
      <div class="panel" style="text-align:center; padding: 40px 20px;">
        <div class="eyebrow">Wartet auf die Regie</div>
        <div class="big-title">Bereit für<br>den Abend?</div>
      </div>
    `;
  } else if (gameState.phase === 'leaderboard') {
    body = `
      <div class="panel" style="text-align:center; padding: 40px 20px;">
        <div class="eyebrow">Zwischenstand</div>
        <div class="big-title">${computeMyPoints()} Punkte</div>
        <div class="rule-text">Die volle Rangliste läuft auf der Leinwand.</div>
      </div>
    `;
  } else if (gameState.phase === 'rules') {
    body = gameShell(game, `<div class="rule-text">${escapeHtml(game.rule)}</div>`);
  } else if (gameState.phase === 'closed') {
    body = gameShell(game, `<div class="rule-text">Runde beendet. Die Regie wertet gerade aus.</div>`);
  } else if (gameState.phase === 'active') {
    body = gameShell(game, activeBody(game));
  } else {
    body = gameShell(game, `<div class="rule-text">${escapeHtml(game.rule)}</div>`);
  }

  return `${myChip()}${body}`;
}

function gameShell(game, inner) {
  return `
    <div class="panel" style="border-top: 6px solid ${game.accent};">
      <span class="stage-badge" style="background:${game.accent};">${escapeHtml(game.sub)}</span>
      <div class="big-title">${escapeHtml(game.name)}</div>
      ${inner}
    </div>
  `;
}

function activeBody(game) {
  if (game.type === 'quiz') return quizBody(game);
  if (game.type === 'taste') return tasteInput(game);
  if (game.type === 'buzzer') return buzzerBody(game);
  if (game.type === 'guess') return guessBody(game);
  // value / manual / race: team just waits, Regie steuert
  return `<div class="rule-text">${escapeHtml(game.rule)}</div><div class="rule-text" style="margin-top:10px;">Die Regie trägt eure Ergebnisse ein.</div>`;
}

function quizBody(game) {
  const myAnswers = ((((gameData.quiz || {}).answers) || {}));
  const reveal = gameState.quizReveal;
  const letters = ['A', 'B', 'C', 'D'];
  let lastCategory = null;
  let html = '';
  QUIZ_QUESTIONS.forEach((q, idx) => {
    const myAnswer = (myAnswers[idx] || {})[teamId];
    if (q.category !== lastCategory) {
      html += `<div style="margin: 18px 0 8px; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; color: var(--ink-soft); border-top: 1px solid var(--line); padding-top: 14px;">${escapeHtml(q.category)}</div>`;
      lastCategory = q.category;
    }
    const opts = q.options.map((opt, i) => {
      const picked = myAnswer === i;
      const isCorrect = reveal && i === q.correct;
      let bg = 'white', border = 'var(--line)';
      if (picked && !reveal) { bg = 'var(--yellow-soft)'; border = 'var(--ink)'; }
      if (reveal && isCorrect) { bg = '#E4F0EE'; border = '#2E7D74'; }
      if (reveal && picked && !isCorrect) { bg = '#F6E7EA'; border = '#B24C63'; }
      return `<div onclick="${reveal ? '' : `answerQuiz(${idx}, ${i})`}" style="text-align:left; font-weight:700; margin: 6px 0; padding:10px 14px; border-radius:10px; border:2px solid ${border}; background:${bg}; cursor:${reveal ? 'default' : 'pointer'}; font-size:14px;">
        ${letters[i]}) ${escapeHtml(opt)}
      </div>`;
    }).join('');
    html += `
      <div style="margin-bottom: 14px;">
        <div style="font-weight:800; font-size:15px; margin-bottom:6px;">${idx + 1}. ${escapeHtml(q.text)}</div>
        ${opts}
      </div>
    `;
  });
  // Jede Antwort wird zwar schon beim Anklicken sofort gespeichert, aber die Gruppen wollten eine
  // sichtbare Bestätigung, dass ihre Abgabe wirklich angekommen ist.
  const confirmed = !!(((gameData.quiz || {}).confirmed || {})[teamId]);
  if (!reveal) {
    html += confirmed ? `
      <div style="text-align:center; margin-top:16px; font-weight:800; color:#2E7D74;">✓ Antworten gespeichert</div>
    ` : `
      <button style="width:100%; margin-top:16px;" onclick="saveQuiz()">Antworten speichern</button>
    `;
  }
  return html;
}
function answerQuiz(idx, optionIndex) {
  // Nur schreiben, solange das Quiz auch wirklich aktiv ist, damit nach dem Schließen der Runde
  // keine Antworten mehr nachträglich verändert werden können.
  if (gameState.activeGameId !== 'quiz' || gameState.phase !== 'active') return;
  db.ref('games/quiz/answers/' + idx + '/' + teamId).set(optionIndex).catch(console.error);
  // Neue Auswahl hebt eine vorherige Bestätigung wieder auf, bis erneut gespeichert wird.
  db.ref('games/quiz/confirmed/' + teamId).remove().catch(console.error);
}
function saveQuiz() {
  if (gameState.activeGameId !== 'quiz' || gameState.phase !== 'active') return;
  db.ref('games/quiz/confirmed/' + teamId).set(true).catch(console.error);
}

function tasteInput(game) {
  const answers = ((gameData.taste || {}).answers || {})[teamId] || [];
  const revealedIndex = (gameData.taste || {}).revealedIndex || 0;
  const ready = !!(((gameData.taste || {}).ready || {})[teamId]);
  let slots = '';
  for (let i = 0; i < TASTE_FOODS.length; i++) {
    const locked = i < revealedIndex || ready;
    slots += `
      <div class="taste-slot">
        <span class="n">${i + 1}.</span>
        <input id="tasteSlot${i}" type="text" ${locked ? 'disabled' : ''} value="${escapeHtml(answers[i] || '')}"
          placeholder="Was schmeckt ihr?" onchange="submitTasteAnswer(${i}, this.value)">
      </div>
    `;
  }
  return `
    <div>${slots}</div>
    <button style="width:100%; margin-top:14px;" ${ready ? 'disabled' : ''} onclick="finishTaste('${game.id}')">${ready ? 'Abgeschickt' : 'Fertig, Antworten abschicken'}</button>
    <div class="save-note">${ready ? 'Eure Antworten sind gespeichert.' : 'Wird laufend gespeichert, Fertig sichert auch euren letzten Eintrag.'}</div>
  `;
}
function submitTasteAnswer(index, val) {
  if (gameState.activeGameId !== 'taste' || gameState.phase !== 'active') return;
  db.ref('games/taste/answers/' + teamId + '/' + index).set(val).catch(console.error);
}
function finishTaste(gameId) {
  if (gameState.activeGameId !== gameId || gameState.phase !== 'active') return;
  // Auch das Feld sichern, in dem gerade noch getippt wird, ohne dass vorher weggeklickt wurde.
  for (let i = 0; i < TASTE_FOODS.length; i++) {
    const el = document.getElementById('tasteSlot' + i);
    if (el) submitTasteAnswer(i, el.value);
  }
  db.ref('games/taste/ready/' + teamId).set(true).catch(console.error);
}

function buzzerBody(game) {
  const round = gameState.round || 1;
  // Manche Runden (z.B. Numbers Game Runde 3) laufen nicht über den Buzzer, sondern per
  // Zahlen-Eingabe: wer am nächsten an der Zielzahl liegt, gewinnt statt wer zuerst buzzert.
  const roundConfig = game.numbersRounds && game.numbersRounds[round - 1];
  if (roundConfig && roundConfig.mode === 'closest') return closestValueBody(game, round);
  const buzzed = (((gameData[game.id] || {}).rounds || {})[round] || {}).buzzes || {};
  const alreadyBuzzed = buzzed[teamId];
  const label = game.roundLabel ? game.roundLabel + ' ' + round : 'Runde ' + round + ' von ' + game.rounds;
  return `
    <div class="rule-text">${label}</div>
    <button class="buzzer-btn ${alreadyBuzzed ? 'locked' : 'yellow'}" ${alreadyBuzzed ? 'disabled' : ''} onclick="pressBuzzer('${game.id}', ${round})">
      ${alreadyBuzzed ? 'Gebuzzert!' : 'BUZZER'}
    </button>
  `;
}
function closestValueBody(game, round) {
  const answers = (((gameData[game.id] || {}).rounds || {})[round] || {}).answers || {};
  const mine = answers[teamId];
  const label = game.roundLabel ? game.roundLabel + ' ' + round : 'Runde ' + round + ' von ' + game.rounds;
  const already = mine !== undefined && mine !== null && mine !== '';
  if (already) {
    return `
      <div class="rule-text">${label}</div>
      <div style="text-align:center; margin-top:16px; font-weight:800; color:#2E7D74;">✓ Eingetragen: ${escapeHtml(String(mine))}</div>
      <div class="save-note">Wer am nächsten an der Zielzahl ist, gewinnt diese Runde.</div>
    `;
  }
  return `
    <div class="rule-text">${label}</div>
    <input id="closestInput_${game.id}" type="number" step="any" placeholder="Euer Ergebnis" style="width:100%; margin-top:10px;">
    <button style="width:100%; margin-top:10px;" onclick="submitClosestValue('${game.id}', ${round})">Abschicken</button>
  `;
}
function submitClosestValue(gameId, round) {
  if (gameState.activeGameId !== gameId || gameState.phase !== 'active') return;
  const el = document.getElementById('closestInput_' + gameId);
  const val = el ? parseFloat(el.value) : NaN;
  if (isNaN(val)) { alert('Bitte eine Zahl eingeben.'); return; }
  db.ref('games/' + gameId + '/rounds/' + round + '/answers/' + teamId).set(val).catch(console.error);
}
function pressBuzzer(gameId, round) {
  if (gameState.activeGameId !== gameId || gameState.phase !== 'active') return;
  db.ref('games/' + gameId + '/rounds/' + round + '/buzzes/' + teamId).set(firebase.database.ServerValue.TIMESTAMP).catch(console.error);
}

// ---------- KI-Songs: Titel-Eingabe statt Buzzer ----------
// Der Titel wird nur intern gespeichert (nicht öffentlich angezeigt), die Regie prüft von Hand,
// ob richtig geraten wurde. Ablauf/Rhythmus (eine Abgabe pro Runde, danach gesperrt) wie beim Buzzer.
function guessBody(game) {
  const round = gameState.round || 1;
  const guesses = (((gameData[game.id] || {}).rounds || {})[round] || {}).guesses || {};
  const mine = guesses[teamId];
  const label = game.roundLabel ? game.roundLabel + ' ' + round : 'Runde ' + round + ' von ' + game.rounds;
  if (mine) {
    return `
      <div class="rule-text">${label}</div>
      <div style="text-align:center; margin-top:16px; font-weight:800; color:#2E7D74;">✓ Abgeschickt: "${escapeHtml(mine.title || '')}"</div>
      <div class="save-note">Die Regie prüft von Hand, ob es richtig war.</div>
    `;
  }
  return `
    <div class="rule-text">${label}</div>
    <input id="guessInput_${game.id}" type="text" placeholder="Wie heißt das Lied?" style="width:100%; margin-top:10px;">
    <button style="width:100%; margin-top:10px;" onclick="submitGuess('${game.id}', ${round})">Abschicken</button>
  `;
}
function submitGuess(gameId, round) {
  if (gameState.activeGameId !== gameId || gameState.phase !== 'active') return;
  const el = document.getElementById('guessInput_' + gameId);
  const title = el ? el.value.trim() : '';
  if (!title) { alert('Bitte einen Titel eingeben.'); return; }
  db.ref('games/' + gameId + '/rounds/' + round + '/guesses/' + teamId).set({
    title: title,
    ts: firebase.database.ServerValue.TIMESTAMP,
  }).catch(console.error);
}

// ---------- Status-Vorschau für die Regie ----------
// Meldet in Kurzform, was gerade auf dem Team-Handy zu sehen ist, damit die Regie eine
// grobe Übersicht über alle Teams hat, ohne die Bildschirme wirklich zu spiegeln.
let _lastReportedStatus = null;
function reportStatus(text) {
  if (!myTeam || text === _lastReportedStatus) return;
  _lastReportedStatus = text;
  db.ref('teams/' + teamId + '/status').set(text).catch(console.error);
}
function liveStatusText() {
  const game = gameById(gameState.activeGameId);
  if (!game || gameState.phase === 'idle') return 'Wartet auf den Abend';
  if (gameState.phase === 'leaderboard') return 'Sieht Zwischenstand';
  if (gameState.phase === 'rules') return 'Sieht Regeln: ' + game.name;
  if (gameState.phase === 'closed') return 'Sieht Rundenauswertung: ' + game.name;
  if (gameState.phase === 'active') return 'Spielt: ' + game.name;
  return 'Online';
}

function render() {
  // Bug-Fix: tippt eine Person im Team (z.B. beim Taste Test), während eine ANDERE Person im
  // selben Team gerade etwas speichert, kommt dadurch ein Firebase-Update rein, das die ganze
  // Seite neu aufbaut - das hat bisher das noch nicht abgeschickte Eingabefeld mitten im Tippen
  // geleert. Deshalb Fokus + aktueller (noch nicht gespeicherter) Wert vorher merken und danach
  // wiederherstellen, damit niemand mehr Antworten verliert.
  const active = document.activeElement;
  let saved = null;
  if (active && active.tagName === 'INPUT' && active.id) {
    saved = { id: active.id, value: active.value, selStart: active.selectionStart, selEnd: active.selectionEnd };
  }
  renderInner();
  if (saved) {
    const el = document.getElementById(saved.id);
    if (el && el.tagName === 'INPUT') {
      el.value = saved.value;
      el.focus();
      if (el.setSelectionRange) { try { el.setSelectionRange(saved.selStart, saved.selEnd); } catch (e) {} }
    }
  }
}

function renderInner() {
  if (!myTeam) { app.innerHTML = connBadgeHtml() + joinScreen(); return; }
  if (!myTeam.priosLocked) {
    if (!gameState.priosReleased) {
      reportStatus('Wartet auf Freigabe der Priorisierung');
      app.innerHTML = connBadgeHtml() + myChip() + prioWaitScreen();
      return;
    }
    reportStatus('Wählt Prio-Boxen');
    app.innerHTML = connBadgeHtml() + myChip() + prioScreen();
    return;
  }
  if (gameState.currentPicker === teamId) {
    const showConfirmation = gameState.pickerChoice && pickerChoiceAt && (Date.now() - pickerChoiceAt < 3000);
    if (!gameState.pickerChoice || showConfirmation) {
      reportStatus('Wählt die nächste Box aus');
      app.innerHTML = connBadgeHtml() + myChip() + pickerScreen();
      return;
    }
    // Nach 3 Sekunden Bestätigung: zurück zum normalen Bildschirm, wie bei allen anderen Teams.
  }
  reportStatus(liveStatusText());
  app.innerHTML = connBadgeHtml() + liveScreen();
}

render();

// ---------- Kleine, dauerhafte Countdown-Leiste ----------
// Läuft unabhängig von render()/innerHTML, damit sie nicht durch andere Updates verschwindet oder
// stockt. Synchron zur Präsentationsfolie über dieselben Firebase-Felder (gameState.timerEndsAt/
// timerDuration), die die Regie über Start/Pause/Reset steuert.
function updateCountdownBar() {
  const bar = document.getElementById('countdownBar');
  const fill = document.getElementById('countdownFill');
  const text = document.getElementById('countdownText');
  if (!bar || !fill || !text) return;
  const total = gameState.timerDuration || 0;
  const running = !!gameState.timerEndsAt;
  const remaining = running ? Math.max(0, (gameState.timerEndsAt - Date.now()) / 1000) : total;
  text.textContent = fmtTime(remaining);
  const pct = total > 0 ? Math.max(0, Math.min(100, (remaining / total) * 100)) : 0;
  fill.style.width = pct + '%';
  bar.classList.toggle('idle', !running);
}
setInterval(updateCountdownBar, 250);
updateCountdownBar();
</script>
